<!--
  META-ANZEIGEN · VORLAGE für alle Beauty-Module (1080 × 1350, Feed 4:5). kunde-anlegen.py setzt die Anzeigen des Moduls
  aus module.py ein ({{anzeigen_html}}) und füllt die Farben. creatives-rendern.js macht daraus PNGs.
  Standard (Fassung 2): großes Foto, darunter Kicker, Überschrift = Angebot, EINE Unterzeile, Knopf. Kein Kleingedrucktes auf dem Bild.
  Eine Schriftfamilie für Überschriften (Fraunces), eine für Text (Inter Tight). Keine Verläufe, keine Icons.
-->
<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><title>Anzeigen · {{betrieb}}</title><style>
@font-face{font-family:"Inter Tight";src:url(fonts/inter-tight-latin-500-normal.woff2);font-weight:500;}
@font-face{font-family:"Inter Tight";src:url(fonts/inter-tight-latin-600-normal.woff2);font-weight:600;}
@font-face{font-family:"Inter Tight";src:url(fonts/inter-tight-latin-700-normal.woff2);font-weight:700;}
@font-face{font-family:"Fraunces";src:url(fonts/fraunces-latin-400-normal.woff2);font-weight:400;}
@font-face{font-family:"Fraunces";src:url(fonts/fraunces-latin-400-italic.woff2);font-weight:400;font-style:italic;}
*{box-sizing:border-box;margin:0;padding:0;}
:root{{{farben_css}}}
body{background:#888;display:flex;flex-direction:column;gap:40px;padding:40px;align-items:flex-start;-webkit-font-smoothing:antialiased;}
.ad{width:1080px;height:1350px;position:relative;overflow:hidden;flex:0 0 auto;font-family:"Inter Tight",sans-serif;}
.photo{position:absolute;left:0;top:0;width:1080px;height:830px;background-size:cover;background-position:center;background-repeat:no-repeat;}
.band{position:absolute;left:0;right:0;top:830px;bottom:0;padding:44px 72px 0;}
.kicker{font-size:26px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;}
h1{font-family:"Fraunces",serif;font-weight:400;font-size:84px;line-height:1.02;letter-spacing:-.02em;margin-top:16px;max-width:940px;}
h1 em{font-style:italic;}
.sub{font-size:33px;font-weight:600;line-height:1.3;margin-top:18px;letter-spacing:-.005em;max-width:630px;}
h1.lang{font-size:68px;}
.cta{position:absolute;right:72px;bottom:56px;padding:22px 34px;border-radius:999px;font-size:31px;font-weight:700;display:flex;gap:14px;align-items:center;}
.cta span{font-size:36px;line-height:1;}
.fine{display:none;}
.a{background:var(--bg);color:var(--ink)}.a .kicker,.a em,.a .cta span{color:var(--accent)}.a .sub{color:var(--ink2)}.a .fine{color:var(--muted)}.a .cta{background:var(--ink);color:#fff}.a .cta span{color:#fff}
.b{background:var(--dunkel);color:#F6F1EC}.b .kicker,.b em,.b .cta span{color:var(--soft)}.b .sub{color:#DCD5CE}.b .fine{color:#A39A92}.b .cta{background:#F6F1EC;color:var(--dunkel)}.b .cta span{color:var(--accent)}
.c{background:var(--soft);color:var(--ink)}.c .kicker,.c em,.c .cta span{color:var(--accent)}.c .sub{color:var(--ink2)}.c .fine{color:var(--muted)}.c .cta{background:var(--accent);color:#fff}.c .cta span{color:#fff}
.d{background:#FFFFFF;color:var(--ink)}.d .kicker,.d em,.d .cta span{color:var(--accent)}.d .sub{color:var(--ink2)}.d .fine{color:var(--muted)}.d .cta{background:var(--accent);color:#fff}.d .cta span{color:#fff}
.e{background:var(--accent);color:#FFFFFF}.e .kicker,.e .cta span{color:#FFFFFF;opacity:.85}.e em{color:#FFFFFF}.e .sub{color:#F2EEEA}.e .fine{color:#E6DED8;opacity:.85}.e .cta{background:#fff;color:var(--accent)}.e .cta span{color:var(--accent);opacity:1}
/* Stil g: Gewinnspiel. Foto über die ganze Fläche, oben dunkler Schleier mit dem Hauptgewinn, unten Knopf und Bedingung. */
.g{background:#1C1512;color:#fff}
.g .photo{height:1350px;}
.g::before{content:"";position:absolute;left:0;right:0;top:0;height:760px;background:linear-gradient(rgba(18,12,10,.78),rgba(18,12,10,.55) 55%,rgba(18,12,10,0));z-index:1;}
.g::after{content:"";position:absolute;left:0;right:0;bottom:0;height:380px;background:linear-gradient(rgba(18,12,10,0),rgba(18,12,10,.7));z-index:1;}
.g .band{top:0;bottom:auto;padding:76px 76px 0;z-index:2;}
.g .kicker{display:inline-block;background:var(--accent);color:#fff;padding:12px 22px;border-radius:999px;font-size:26px;letter-spacing:.12em;}
.g .badge{display:inline-block;margin-left:12px;background:#fff;color:#1C1512;padding:12px 22px;border-radius:999px;font-size:26px;font-weight:700;vertical-align:top;}
.g .hook{font-family:"Fraunces",serif;font-style:italic;font-size:46px;line-height:1.1;color:#F3DCCF;margin-top:26px;max-width:930px;}
.g h1{color:#fff;font-size:112px;line-height:.98;margin-top:14px;max-width:930px;}
.g h1.lang{font-size:92px;}
.g .sub{color:#fff;font-size:46px;font-weight:700;margin-top:30px;max-width:940px;line-height:1.25;white-space:pre-line;}
.g .cta{z-index:2;left:76px;right:auto;bottom:128px;background:#fff;color:#1C1512;font-size:36px;padding:26px 42px;}
.g .cta span{color:var(--accent);}
.g .fine{display:block;position:absolute;line-height:1.35;z-index:2;left:76px;right:76px;bottom:62px;font-size:27px;font-weight:600;color:#fff;}
</style></head><body>
{{anzeigen_html}}
</body></html>
